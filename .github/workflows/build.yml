name: Build Windows EXE

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write   # 릴리스(다운로드 페이지)에 zip을 올리기 위해 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: 테스트 (가상 데이터)
        run: python -m pytest tests -q

      - name: exe 만들기
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name GeoseongClosingTool
          --add-data "config.json;."
          app.py

      - name: 배포 폴더 정리
        shell: pwsh
        run: |
          $out = "release/GeoseongClosingTool"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item dist/GeoseongClosingTool.exe $out/
          Copy-Item config.json $out/
          if (Test-Path templates) { Copy-Item templates $out/templates -Recurse }
          Copy-Item docs/사용법.txt $out/

      - name: exe 실행 확인 (5초 동안 창이 꺼지지 않는지)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath release/GeoseongClosingTool/GeoseongClosingTool.exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { Write-Error "exe가 바로 종료되었습니다 (종료 코드 $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "exe 실행 확인 완료"

      - uses: actions/upload-artifact@v4
        with:
          name: GeoseongClosingTool
          path: release/GeoseongClosingTool
          retention-days: 90

      - name: zip 만들기
        shell: pwsh
        run: Compress-Archive -Path release/GeoseongClosingTool -DestinationPath GeoseongClosingTool.zip -Force

      - name: 다운로드 페이지(Releases)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 마감 도우미 (빌드 ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: GeoseongClosingTool.zip
          body: |
            아래 **GeoseongClosingTool.zip** 을 눌러 받으세요.
            압축을 풀지 말고 그대로 카카오톡 '나와의 채팅'으로 보내 호텔 PC에서 압축을 풀어 실행합니다.
            (exe, config.json, templates 폴더는 항상 같은 폴더에)
