name: Build Windows EXE

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: 테스트 (가상 데이터)
        run: python -m pytest tests -q

      - name: exe 만들기
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name GeoseongClosingTool
          --add-data "config.json;."
          app.py

      - name: 배포 폴더 정리
        shell: pwsh
        run: |
          $out = "release/GeoseongClosingTool"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item dist/GeoseongClosingTool.exe $out/
          Copy-Item config.json $out/
          if (Test-Path templates) { Copy-Item templates $out/templates -Recurse }
          Copy-Item docs/사용법.txt $out/

      - name: exe 실행 확인 (5초 동안 창이 꺼지지 않는지)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath release/GeoseongClosingTool/GeoseongClosingTool.exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { Write-Error "exe가 바로 종료되었습니다 (종료 코드 $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "exe 실행 확인 완료"

      - uses: actions/upload-artifact@v4
        with:
          name: GeoseongClosingTool
          path: release/GeoseongClosingTool
          retention-days: 90
